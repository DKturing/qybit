[package]
name = "qy-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# 独立 workspace：fuzz 需要 nightly 与 libFuzzer，不进入主 workspace 的常规检查。
[workspace]

[dependencies]
# libFuzzer 绑定，仅用于 fuzz。
libfuzzer-sys = "=0.4.10"
qy-core = { path = "../crates/qy-core" }
# F3：浮点转整数（转换 fuzz 目标）。
qy-pcm-format = { path = "../crates/qy-pcm-format" }
qy-codec-wav = { path = "../crates/qy-codec-wav" }
qy-codec-flac = { path = "../crates/qy-codec-flac" }
# F2：AIFF / AIFF-C 解码。
qy-codec-aiff = { path = "../crates/qy-codec-aiff" }
# 按文件头选择解码器（含 ID3v2 标签跳过）。
qy-codec-auto = { path = "../crates/qy-codec-auto" }
# R1 §4：损坏文件系统 fuzz（FatStorage 经 embedded-sdmmc；基础镜像由 qy-fat-image 生成）。
qy-host-embedded = { path = "../crates/qy-host-embedded" }
embedded-sdmmc = { version = "=0.10.0", default-features = false }
qy-fat-image = { path = "../tools/qy-fat-image" }
# M2 T5：场景 fuzz（真实核心、解码、pack 与队列的模拟宿主）。
qy-host-sim = { path = "../crates/qy-host-sim" }

[[bin]]
name = "wav_decode"
path = "fuzz_targets/wav_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flac_decode"
path = "fuzz_targets/flac_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aiff_decode"
path = "fuzz_targets/aiff_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auto_decode"
path = "fuzz_targets/auto_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fat_storage"
path = "fuzz_targets/fat_storage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sim_scenario"
path = "fuzz_targets/sim_scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "float_convert"
path = "fuzz_targets/float_convert.rs"
test = false
doc = false
bench = false
