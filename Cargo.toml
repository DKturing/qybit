[workspace]
resolver = "3"
exclude = ["fuzz", "crates/qy-mcu-demo", "crates/qy-board"]
members = [
    "crates/qy-core",
    "crates/qy-codec-wav",
    "crates/qy-codec-flac",
    "crates/qy-codec-aiff",
    "crates/qy-codec-auto",
    "crates/qy-pcm-format",
    "crates/qy-host-sim",
    "crates/qy-player",
    "crates/qy-host-wasapi",
    "crates/qy-host-alsa",
    "crates/qy-host-embedded",
    "crates/qybit",
    "tools/qy-gen-fixtures",
    "tools/qy-fat-image",
    "tools/qy-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DKturing/qybit"
publish = false

[workspace.dependencies]
qy-core = { path = "crates/qy-core" }
qy-codec-wav = { path = "crates/qy-codec-wav" }
qy-codec-flac = { path = "crates/qy-codec-flac" }
qy-codec-aiff = { path = "crates/qy-codec-aiff" }
qy-codec-auto = { path = "crates/qy-codec-auto" }
qy-pcm-format = { path = "crates/qy-pcm-format" }
qy-host-sim = { path = "crates/qy-host-sim" }
qy-player = { path = "crates/qy-player" }
qy-host-wasapi = { path = "crates/qy-host-wasapi" }
qy-host-alsa = { path = "crates/qy-host-alsa" }
# 成熟 SPSC 环形队列：存放已 pack 的完整设备帧字节（AGENTS §2，不自行编写无锁缓冲）。
rtrb = { version = "=0.4.0", default-features = false }
# 成熟静态 SPSC BipBuffer（no_std 无 alloc）：MCU 宿主的设备帧队列（M3 T1）。关闭默认特性：
# 只用 CAS 原子协调与轮询通知，不引入 maitake-sync / critical-section。
bbqueue = { version = "=0.7.0", default-features = false }
# SD 卡 / FAT 文件系统读取（no_std，无 alloc），通用嵌入式宿主（M3 T2）读取曲目文件。关闭默认的
# log 特性。2026-07-24 发布，审阅记录见 docs/m3-t2-embedded-host.md。
embedded-sdmmc = { version = "=0.10.0", default-features = false }
# 按偏移读取的存储设备标准接口（no_std，无依赖），通用嵌入式宿主的无文件系统曲目存储（闪存等）。
# 2026-09-20 发布，rust-embedded-community。
embedded-storage = { version = "=0.3.2", default-features = false }
# MCU 一次性静态零缓冲（ConstStaticCell），仅 qy-codec-flac 的 static-cell 特性使用。
static_cell = { version = "=2.1.1", default-features = false }
# ALSA 绑定（封装系统 alsa-lib），仅 Linux 目标使用（M2 T3）。
alsa = { version = "=0.12.1", default-features = false, features = ["std"] }
# 渲染线程实时调度（sched_setscheduler），仅 Linux 目标使用；版本与锁文件中 alsa 的依赖一致。
libc = { version = "=0.2.190", default-features = false }
# Windows SDK 绑定（WASAPI / COM），仅 Windows 目标使用。
windows = { version = "=0.62.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
# M2 T5：Kani 证明在 cfg(kani) 下编译。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
