name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 通用模块：Linux 与 Windows 均执行格式检查、Clippy 与测试。
  generic:
    name: 通用模块 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链（rust-toolchain.toml）
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p qy-core -p qy-codec-wav -p qy-codec-flac -p qy-pcm-format -p qy-host-sim -p qy-gen-fixtures --all-targets -- -D warnings
      - run: cargo clippy --locked -p qy-codec-flac --features static-cell,test-metrics --all-targets -- -D warnings
      - run: cargo test --locked -p qy-core -p qy-codec-wav -p qy-host-sim
      - run: cargo test --locked -p qy-codec-flac
      - run: cargo test --locked -p qy-codec-flac --features static-cell,test-metrics
      - run: cargo test --locked -p qy-pcm-format
      - run: cargo test --locked -p qy-pcm-format --features ring

  # 精简 crate 的 no_std 目标编译。
  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-core
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-wav
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-pcm-format
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-flac
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features static-cell
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features test-metrics
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-core -p qy-codec-wav -p qy-pcm-format -p qy-codec-flac -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features static-cell -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features test-metrics -- -D warnings

  # Windows 宿主与 CLI 构建、测试。
  windows:
    name: Windows 宿主
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy --locked -p qy-host-wasapi -p qybit --all-targets -- -D warnings
      - run: cargo build --locked -p qy-host-wasapi -p qybit
      - run: cargo test --locked -p qy-host-wasapi -p qybit

  # WAV 解码 fuzz 冒烟（60 秒，以夹具为初始语料）。正式 10 分钟记录见 docs/m0-t2-wav.md。
  fuzz-smoke:
    name: fuzz 冒烟 (wav_decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-12 --profile minimal
      - run: cargo +nightly-2026-10-12 install cargo-fuzz --version 0.13.2 --locked
      - name: 生成初始语料
        run: |
          mkdir -p fuzz/corpus/wav_decode
          for f in crates/qy-codec-wav/tests/fixtures/*.wav; do
            n=$(basename "$f")
            (printf '\x00'; cat "$f") > "fuzz/corpus/wav_decode/$n.s0"
            (printf '\x07'; cat "$f") > "fuzz/corpus/wav_decode/$n.s7"
          done
      - working-directory: fuzz
        run: cargo +nightly-2026-10-12 fuzz run wav_decode -- -max_total_time=60 -max_len=65536 -seed=1
