name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 通用模块：Linux 与 Windows 均执行格式检查、Clippy 与测试。
  generic:
    name: 通用模块 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链（rust-toolchain.toml）
        run: rustup show
      - name: 安装 alsa-lib 开发包（qy-host-alsa 的 Linux 绑定）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p qy-core -p qy-codec-wav -p qy-codec-flac -p qy-codec-auto -p qy-pcm-format -p qy-host-sim -p qy-player -p qy-host-alsa -p qy-host-embedded -p qy-gen-fixtures -p qy-fat-image --all-targets -- -D warnings
      - run: cargo clippy --locked -p qy-player --features test-support --all-targets -- -D warnings
      - run: cargo clippy --locked -p qy-codec-flac --features static-cell,test-metrics --all-targets -- -D warnings
      - run: cargo test --locked -p qy-core -p qy-codec-wav -p qy-codec-auto -p qy-host-sim -p qy-player -p qy-host-alsa -p qy-host-embedded -p qy-fat-image
      - run: cargo test --locked -p qy-codec-flac
      - run: cargo test --locked -p qy-codec-flac --features static-cell,test-metrics
      - run: cargo test --locked -p qy-pcm-format
      - run: cargo test --locked -p qy-pcm-format --features ring
      - run: cargo test --locked -p qy-pcm-format --features ring,static-queue
      - run: cargo clippy --locked -p qy-pcm-format --features ring,static-queue --all-targets -- -D warnings
      - name: 上传回环 A 层报告（file 插件）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: qybit-alsa-loopback-file
          path: target/qybit-report/qybit-alsa-loopback-file.json
          if-no-files-found: error

  # 精简 crate 的 no_std 目标编译。
  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-core
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-wav
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-pcm-format
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-flac
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features static-cell
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features test-metrics
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-auto
      # M3 T1：静态帧队列（bbqueue）与按需链接的解码器。
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-pcm-format --features static-queue
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-auto --no-default-features --features wav
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-auto --no-default-features --features flac
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-codec-auto --no-default-features
      - run: cargo build --locked --target thumbv7em-none-eabihf -p qy-host-embedded
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-host-embedded -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-pcm-format --features static-queue -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-codec-auto --no-default-features --features wav -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-core -p qy-codec-wav -p qy-pcm-format -p qy-codec-flac -p qy-codec-auto -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features static-cell -- -D warnings
      - run: cargo clippy --locked --target thumbv7em-none-eabihf -p qy-codec-flac --features test-metrics -- -D warnings

  # M3 T1：MCU 资源演示（thumbv7em，引擎 + 静态队列 + 自有解码器），在 QEMU mps2-an386（Cortex-M4F）
  # 中运行并按独立参考核对输出、统计栈高水位。这是指令集仿真，不是实机运行。
  mcu-demo:
    name: MCU 演示 (QEMU mps2-an386)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: 格式与 Clippy
        working-directory: crates/qy-mcu-demo
        run: |
          cargo fmt -- --check
          cargo clippy --locked --release --target thumbv7em-none-eabihf -- -D warnings
          cargo clippy --locked --release --target thumbv7em-none-eabihf --no-default-features --features hold -- -D warnings
      - name: 构建 Embedded Full 与 Embedded Lite
        working-directory: crates/qy-mcu-demo
        run: |
          cargo build --locked --release --target thumbv7em-none-eabihf --features hold
          cp target/thumbv7em-none-eabihf/release/qy-mcu-demo target/qy-mcu-demo-full.elf
          cargo build --locked --release --target thumbv7em-none-eabihf --no-default-features --features hold
          cp target/thumbv7em-none-eabihf/release/qy-mcu-demo target/qy-mcu-demo-lite.elf
      - name: QEMU 运行与核对
        env:
          QY_MCU_DEMO_REQUIRED: "1"
          QY_MCU_DEMO_ELF: crates/qy-mcu-demo/target/qy-mcu-demo-full.elf
          QY_MCU_DEMO_LITE_ELF: crates/qy-mcu-demo/target/qy-mcu-demo-lite.elf
        run: cargo test --locked -p qy-host-sim --test mcu_demo -- --nocapture
      # M3 T2 板级适配示例（STM32F411）：只验证能编译，未在实物上运行。
      - name: 板级适配示例（STM32F411，只编译）
        working-directory: crates/qy-board-stm32f411
        run: |
          cargo fmt -- --check
          cargo clippy --locked --release --target thumbv7em-none-eabihf -- -D warnings
          cargo build --locked --release --target thumbv7em-none-eabihf
      - name: 上传 MCU 演示报告
        uses: actions/upload-artifact@v4
        with:
          name: qybit-mcu-demo
          path: |
            target/qybit-report/qybit-mcu-demo.txt
            crates/qy-mcu-demo/target/qy-mcu-demo-full.elf
            crates/qy-mcu-demo/target/qy-mcu-demo-lite.elf
          if-no-files-found: error

  # Windows 宿主与 CLI 构建、测试。
  windows:
    name: Windows 宿主
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy --locked -p qy-host-wasapi -p qybit --all-targets -- -D warnings
      - run: cargo build --locked -p qy-host-wasapi -p qybit
      - run: cargo test --locked -p qy-host-wasapi -p qybit

  # M2 T4 B 层：snd-aloop 内核虚拟声卡回环。runner 不能加载内核模块时明确标记为未运行，
  # A 层（file 插件，见通用模块测试）的结果不能代替 B 层。
  loopback-aloop:
    name: 回环 B 层 (snd-aloop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: 加载 snd-aloop
        id: aloop
        run: |
          if sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe snd-aloop; then
            sudo chmod a+rw /dev/snd/*
            cat /proc/asound/cards
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=B 层未运行::runner 不支持加载 snd-aloop 内核模块，B 层未运行（A 层结果不能代替 B 层）"
            echo "loaded=false" >> "$GITHUB_OUTPUT"
          fi
      - name: B 层回环矩阵
        if: steps.aloop.outputs.loaded == 'true'
        run: cargo test --locked -p qy-host-alsa --test loopback_aloop -- --ignored --nocapture --test-threads=1
      - name: 上传回环报告
        if: always() && steps.aloop.outputs.loaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qybit-alsa-loopback-snd-aloop
          path: target/qybit-report/
      - name: 记录未运行
        if: steps.aloop.outputs.loaded != 'true'
        run: echo "回环 B 层（snd-aloop）：未运行（runner 不支持内核模块）。本地运行见 scripts/aloop-loopback.sh。" >> "$GITHUB_STEP_SUMMARY"

  # 解码 fuzz 冒烟（各 60 秒，以夹具为初始语料）。正式 10 分钟记录见 docs/m0-t2-wav.md 与 docs/m1-t3-integration.md。
  fuzz-smoke:
    name: fuzz 冒烟 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wav_decode
            fixtures: crates/qy-codec-wav/tests/fixtures/*.wav
            max_len: 65536
          - target: flac_decode
            fixtures: crates/qy-codec-flac/tests/fixtures/*.flac
            max_len: 1048576
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-12 --profile minimal
      - run: cargo +nightly-2026-10-12 install cargo-fuzz --version 0.13.2 --locked
      - name: 生成初始语料
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          for f in ${{ matrix.fixtures }}; do
            n=$(basename "$f")
            (printf '\x00'; cat "$f") > "fuzz/corpus/${{ matrix.target }}/$n.s0"
            (printf '\x87'; cat "$f") > "fuzz/corpus/${{ matrix.target }}/$n.s87"
          done
      - working-directory: fuzz
        run: cargo +nightly-2026-10-12 fuzz run ${{ matrix.target }} -- -max_total_time=60 -max_len=${{ matrix.max_len }} -seed=1
