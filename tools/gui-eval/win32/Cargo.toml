[package]
name = "qy-gui-eval-win32"
version = "0.0.0"
edition = "2024"
publish = false
description = "GUI 选型样例：Windows 原生控件（windows crate；列表、按钮、4 Hz 状态栏、中文文字、文件拖放）"

# 独立于主工作区：只用于选型测量。
[workspace]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
