[package]
name = "qybit-gui"
description = "QyBit 图形界面：Windows 原生控件前端（WASAPI 独占）与 Linux 自绘前端（X11，ALSA hw）；播放走与 CLI 相同的核心与自有解码"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "qybit-gui"
path = "src/main.rs"

[features]
# GUI T3 界面核对：用模拟设备代替 WASAPI（真实核心、自有解码、pack 与渲染循环，只模拟设备与时间）。
# 只在 CI 截图核对时编译，发布产物不含。
sim = ["dep:qy-player"]

[dependencies]
qy-ui.workspace = true
qy-player = { workspace = true, features = ["test-support"], optional = true }

[target.'cfg(windows)'.dependencies]
qy-host-wasapi.workspace = true
windows = { workspace = true, features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
qy-core.workspace = true
qy-player.workspace = true
qy-host-alsa.workspace = true
x11rb.workspace = true
tiny-skia.workspace = true
cosmic-text.workspace = true

[dev-dependencies]
qy-player = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
