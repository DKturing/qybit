[package]
name = "qybit-gui"
description = "QyBit 图形界面（GUI T2/T3）：Windows 原生控件前端，播放走与 CLI 相同的核心、自有解码与 WASAPI 独占输出"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "qybit-gui"
path = "src/main.rs"

[dependencies]
qy-ui.workspace = true

[target.'cfg(windows)'.dependencies]
qy-host-wasapi.workspace = true
windows = { workspace = true, features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
