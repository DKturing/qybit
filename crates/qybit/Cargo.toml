[package]
name = "qybit"
description = "QyBit 极简本地音频播放器命令行"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "qybit"
path = "src/main.rs"

[dependencies]
qy-player.workspace = true
# 诊断子命令（decode/tone）：自有解码器、pack 与 WAVE 格式描述。
qy-core.workspace = true
qy-pcm-format.workspace = true
qy-host-wasapi.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
qy-host-alsa.workspace = true

[lints]
workspace = true
