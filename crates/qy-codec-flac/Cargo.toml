[package]
name = "qy-codec-flac"
description = "QyBit 自有推送式 FLAC 解码器（no_std，无 alloc）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# MCU：用 static_cell::ConstStaticCell 提供的一次性静态零缓冲。
static-cell = ["dep:static_cell"]
# 测试统计（解析次数、输入重扫描量、样本运算量）；默认关闭，正式发布不得启用。
test-metrics = []

[dependencies]
qy-core.workspace = true
static_cell = { workspace = true, optional = true }

[[test]]
name = "metrics"
required-features = ["test-metrics"]

[dev-dependencies]
# X1：解码器契约测试。
qy-testkit.workspace = true
qy-codec-wav.workspace = true

[lints]
workspace = true
