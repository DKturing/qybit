[package]
name = "qy-host-alsa"
description = "QyBit Linux ALSA 严格输出宿主（直连 hw 设备）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# 假 ALSA PCM 与假打开器，供本 crate 测试与上层集成测试使用。
test-support = ["qy-player/test-support"]
# A1：alsa-lib 后端（`linux::alsalib`），只供 CI 的 A 层回环测试使用 alsa-lib 的 file 插件；
# 构建需要 libasound 开发包。发布版不开启，程序不依赖 alsa-lib。
alsa-lib = ["dep:alsa"]

[dependencies]
qy-core.workspace = true
qy-player.workspace = true
qy-pcm-format = { workspace = true, features = ["ring"] }

# 内核接口的系统调用（ioctl、poll）与实时调度仅在 Linux 目标编译；alsa-lib 绑定为可选。
[target.'cfg(target_os = "linux")'.dependencies]
alsa = { workspace = true, optional = true }
libc.workspace = true

[dev-dependencies]
qy-player = { workspace = true, features = ["test-support"] }
qy-host-alsa = { path = ".", features = ["test-support"] }

[lints]
workspace = true
