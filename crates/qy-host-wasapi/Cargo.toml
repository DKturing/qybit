[package]
name = "qy-host-wasapi"
description = "QyBit Windows WASAPI 独占宿主"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qy-core.workspace = true
qy-codec-wav.workspace = true
qy-codec-flac.workspace = true
qy-codec-auto.workspace = true
qy-pcm-format = { workspace = true, features = ["ring"] }

# Windows SDK 绑定仅在 Windows 目标编译。
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "std",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[lints]
workspace = true
